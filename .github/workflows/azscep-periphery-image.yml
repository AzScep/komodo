name: Publish AzScep Periphery image

# Builds Periphery from this fork's patched release branch and publishes it
# to ghcr.io/azscep/komodo-periphery. Upstream images remain the source for
# every component this fork does not patch (Core, UI).

on:
  push:
    branches: ["azscep/*.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azscep-periphery-${{ github.ref }}
  cancel-in-progress: false

env:
  # Upstream release this branch is based on. Periphery reports this version
  # so an upstream Core of the same release accepts it.
  UPSTREAM_VERSION: "2.3.3"
  # Increment when the carried patch set (PATCHES.md) changes.
  FORK_REVISION: "2"
  IMAGE: ghcr.io/azscep/komodo-periphery

jobs:
  test:
    name: Test Periphery
    runs-on: ubuntu-latest
    container: rust:1.98.0-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Periphery tests
        run: cargo test -p komodo_periphery --bin periphery

  publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bin/periphery/aio.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.UPSTREAM_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM_VERSION }}-azscep.${{ env.FORK_REVISION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AzScep/komodo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}-azscep.${{ env.FORK_REVISION }}
      - name: Record digest
        run: |
          echo "Published ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
