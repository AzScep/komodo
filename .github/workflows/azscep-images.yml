name: Publish AzScep images

# Builds Core (with the UI) and Periphery from this fork's patched release
# branch and publishes them to ghcr.io/azscep/komodo-core and
# ghcr.io/azscep/komodo-periphery. Deploy both at the same tag.

on:
  push:
    branches: ["azscep/*.x"]
  pull_request:
    branches: ["azscep/*.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azscep-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Upstream release this branch is based on. Core and Periphery report this
  # version so they accept each other and upstream components of the release.
  UPSTREAM_VERSION: "2.3.3"
  # Increment when the carried patch set (PATCHES.md) changes.
  FORK_REVISION: "4"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: rust:1.98.0-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run client tests
        run: cargo test -p komodo_client --lib
      - name: Run Core tests
        run: cargo test -p komodo_core --bin core
      - name: Run Periphery tests
        run: cargo test -p komodo_periphery --bin periphery

  decrypt-script:
    name: Test komodo-age-decrypt
    runs-on: ubuntu-latest
    # The Periphery image's base, with the same packages it installs.
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Periphery image packages
        run: |
          sh bin/periphery/debian-deps.sh
          apt-get update && apt-get install -y jq
      - name: Run decrypt script tests
        run: bin/periphery/tests/komodo-age-decrypt.test.sh

  publish:
    name: Build and publish ${{ matrix.component }}
    needs: [test, decrypt-script]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [core, periphery]
    env:
      IMAGE: ghcr.io/azscep/komodo-${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bin/${{ matrix.component }}/aio.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.UPSTREAM_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM_VERSION }}-azscep.${{ env.FORK_REVISION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AzScep/komodo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}-azscep.${{ env.FORK_REVISION }}
      # Test the exact digest that was pushed, so the digest recorded for
      # deploys is the one these checks ran against.
      - name: Run decrypt script tests in the published image
        if: matrix.component == 'periphery'
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/bin/periphery/tests:/tests:ro" "${IMAGE}@${DIGEST}" \
            -c 'apt-get update -qq && apt-get install -y -qq jq > /dev/null && /tests/komodo-age-decrypt.test.sh /usr/local/bin/komodo-age-decrypt'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Record digest
        run: |
          echo "Published ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
